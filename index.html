<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Currie Star 2017s</title>

<style>

body{
background:#083b08;
color:white;
font-family:Arial;
margin:0;
}

header{
background:#111;
padding:20px;
text-align:center;
}

h1{
margin:0;
color:gold;
}

.container{
padding:15px;
max-width:1000px;
margin:auto;
}

.card{
background:#145214;
padding:15px;
margin:15px 0;
border-radius:10px;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
}

button{
padding:12px;
background:gold;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border:1px solid #333;
}

th{
background:#222;
}

.player-box{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:5px;
}

.form{
font-size:28px;
}

</style>

</head>

<body>

<header>

<h1>⚽ Currie Star 2017s</h1>

<h3>Season 2</h3>

</header>

<div class="container">

<div class="card">

<h2>Add Match</h2>

<input id="date" type="date">

<input id="opponent" placeholder="Opponent">

<select id="venue">
<option>Home</option>
<option>Away</option>
</select>

<input id="goalsFor" type="number" placeholder="Goals For">

<input id="goalsAgainst" type="number" placeholder="Goals Against">

<select id="captain"></select>

<h3>Players Who Played</h3>

<div id="playerChecks" class="player-box"></div>

<h3>Scorers</h3>

<textarea
id="scorers"
style="width:100%;height:100px;"
placeholder="Example:

Finn, Finn, Finn
Freddy, Freddy
Luke
">
</textarea>

<br><br>

<button onclick="saveMatch()">
Save Match
</button>

</div>

<div class="card">
<h2>📊 Season Summary</h2>

<div id="summary"></div>
</div>

<div class="card">
<h2>🔥 Form Guide</h2>

<div class="form" id="formGuide"></div>
</div>

<div class="card">
<h2>🏆 Top Scorers</h2>

<div id="topScorers"></div>
</div>

<div class="card">
<h2>👥 Squad Stats</h2>

<div id="playerStats"></div>
</div>

<div class="card">
<h2>📅 Match History</h2>

<div id="matches"></div>
</div>

</div>

<script>

const players = [
"Jamie",
"Mohammad",
"Luke",
"Sam",
"Freddy",
"Magnus",
"Francesco",
"Thomas",
"Finn",
"Oliver",
"Brodie"
];

let matches =
JSON.parse(
localStorage.getItem("currieMatches")
) || [];


function setupPlayers(){

const area =
document.getElementById("playerChecks");

const captain =
document.getElementById("captain");

players.forEach(player=>{

captain.innerHTML +=
`<option>${player}</option>`;

area.innerHTML += `
<label>
<input
type="checkbox"
value="${player}">
${player}
</label>
`;

});

}

function saveMatch(){

const played=[];

document
.querySelectorAll(
"#playerChecks input:checked"
)
.forEach(box=>{
played.push(box.value);
});

const scorers=
document
.getElementById("scorers")
.value
.split("\n")
.filter(x=>x.trim()!="");

matches.push({

date:
document.getElementById("date").value,

opponent:
document.getElementById("opponent").value,

venue:
document.getElementById("venue").value,

goalsFor:
Number(
document.getElementById("goalsFor").value
),

goalsAgainst:
Number(
document.getElementById("goalsAgainst").value
),

captain:
document.getElementById("captain").value,

players:
played,

scorers:
scorers

});

localStorage.setItem(
"currieMatches",
JSON.stringify(matches)
);

render();

alert("⚽ Match Saved");

}

function render(){

let wins=0;
let draws=0;
let losses=0;

let goalsFor=0;
let goalsAgainst=0;

const appearances={};
const goals={};
const captaincies={};

players.forEach(player=>{
appearances[player]=0;
goals[player]=0;
captaincies[player]=0;
});

let form="";

matches.forEach(match=>{

goalsFor+=match.goalsFor;
goalsAgainst+=match.goalsAgainst;

if(match.goalsFor>match.goalsAgainst){
wins++;
form+="🟢 ";
}
else if(match.goalsFor==match.goalsAgainst){
draws++;
form+="🟡 ";
}
else{
losses++;
form+="🔴 ";
}

captaincies[match.captain]++;

match.players.forEach(player=>{
appearances[player]++;
});

match.scorers.forEach(player=>{
if(goals[player]!=undefined){
goals[player]++;
}
});

});

document.getElementById("summary")
.innerHTML=`
<p>Games: ${matches.length}</p>
<p>Wins: ${wins}</p>
<p>Draws: ${draws}</p>
<p>Losses: ${losses}</p>
<p>Goals For: ${goalsFor}</p>
<p>Goals Against: ${goalsAgainst}</p>
`;

document.getElementById("formGuide")
.innerHTML=form;

let scorerHTML="<table>";
scorerHTML+=`
<tr>
<th>Player</th>
<th>Goals</th>
</tr>
`;

Object.entries(goals)

.sort((a,b)=>b[1]-a[1])

.forEach(row=>{

scorerHTML+=`
<tr>
<td>${row[0]}</td>
<td>${row[1]}</td>
</tr>
`;

});

scorerHTML+="</table>";

document.getElementById("topScorers")
.innerHTML=scorerHTML;

let squadHTML="<table>";

squadHTML+=`
<tr>
<th>Player</th>
<th>Apps</th>
<th>Goals</th>
<th>Captaincies</th>
</tr>
`;

players.forEach(player=>{

squadHTML+=`
<tr>
<td>${player}</td>
<td>${appearances[player]}</td>
<td>${goals[player]}</td>
<td>${captaincies[player]}</td>
</tr>
`;

});

squadHTML+="</table>";

document.getElementById("playerStats")
.innerHTML=squadHTML;

let matchHTML="<table>";

matchHTML+=`
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Score</th>
<th>Captain</th>
</tr>
`;

matches
.slice()
.reverse()
.forEach(match=>{

matchHTML+=`
<tr>
<td>${match.date}</td>
<td>${match.opponent}</td>
<td>${match.goalsFor}-${match.goalsAgainst}</td>
<td>${match.captain}</td>
</tr>
`;

});

matchHTML+="</table>";

document.getElementById("matches")
.innerHTML=matchHTML;

}

setupPlayers();
render();

</script>

</body>
</html>
